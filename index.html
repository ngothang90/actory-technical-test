<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test Kỹ Thuật Hàng Ngày</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Đăng Ký Làm Bài Test</h1>
        
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">Họ và tên nhân sự:</label>
            <input type="text" id="username" placeholder="Nhập tên của bạn..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="space-y-3">
            <button onclick="startTest('cokhi')" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                Thi Phần: Cơ Khí Cơ Bản (10 câu)
            </button>
            <button onclick="startTest('gasbox')" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">
                Thi Phần: Gasbox (10 câu)
            </button>
        </div>
    </div>

    <script>
        function startTest(category) {
            const username = document.getElementById('username').value.trim();
            if (!username) {
                alert('Vui lòng nhập tên trước khi bắt đầu!');
                return;
            }
            // Lưu thông tin vào sessionStorage để chuyển sang trang quiz
            sessionStorage.setItem('test_user', username);
            sessionStorage.setItem('test_category', category);
            window.location.href = 'quiz.html';
        }
    </script>
</body>
</html>
