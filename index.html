<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Test Kỹ Thuật Nhà Máy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="questions_data.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center p-6">
    <div class="max-w-xl w-full bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Bài Test Kỹ Thuật Hàng Ngày</h1>
        
        <div id="setup-screen" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Họ và tên nhân sự:</label>
                <input type="text" id="username" placeholder="Nhập tên của bạn..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex gap-4 pt-2">
                <button onclick="startTest('cokhi')" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">Thi Cơ Khí (10 câu)</button>
                <button onclick="startTest('gasbox')" class="flex-1 bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">Thi Gasbox (10 câu)</button>
            </div>
        </div>

        <div id="quiz-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <span id="display-info" class="font-bold text-blue-600"></span>
                <span id="timer" class="text-gray-500 text-sm"></span>
            </div>
            <div id="questions-container" class="space-y-6"></div>
            <button onclick="submitQuiz()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition">Nộp Bài</button>
        </div>

        <div id="result-screen" class="hidden text-center space-y-4">
            <h2 class="text-2xl font-bold text-gray-800">Kết Quả Bài Test</h2>
            <div id="score-display" class="text-4xl font-extrabold text-blue-600"></div>
            <p id="feedback-text" class="text-gray-600"></p>
            <button onclick="location.reload()" class="bg-gray-800 text-white px-6 py-2 rounded-lg hover:bg-gray-700 transition">Làm Bài Khác</button>
        </div>
    </div>

    <script>
        let allQuestions = [];
        let currentQuiz = [];
        let userInfo = { name: '', category: '' };

        // Gán dữ liệu từ file questions_data.js vào biến toàn cục khi tải trang
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof questions !== 'undefined') {
                allQuestions = questions;
            } else {
                alert('Không thể tải dữ liệu câu hỏi từ file questions_data.js!');
            }
        });

        function startTest(category) {
            const name = document.getElementById('username').value.trim();
            if (!name) {
                alert('Vui lòng nhập họ và tên trước khi bắt đầu!');
                return;
            }
            userInfo = { name, category };

            // Lọc câu hỏi theo danh mục
            let filtered = allQuestions.filter(q => q.category === category);
            if (filtered.length === 0) {
                alert('Chưa có câu hỏi cho phần này trong hệ thống!');
                return;
            }

            // Thuật toán lấy ngẫu nhiên 10 câu không trùng lặp trong bộ đề
            let shuffled = [...filtered].sort(() => Math.random() - 0.5);
            currentQuiz = shuffled.slice(0, 10);

            // Chuyển màn hình
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('display-info').innerText = `${name} - Phần: ${category === 'cokhi' ? 'Cơ Khí' : 'Gasbox'}`;

            renderQuiz();
        }

        function renderQuiz() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            currentQuiz.forEach((q, qIndex) => {
                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label class="block p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition">
                            <input type="radio" name="q_${qIndex}" value="${optIndex}" class="mr-2">
                            ${opt}
                        </label>
                    `;
                });
                container.innerHTML += `
                    <div class="space-y-2">
                        <p class="font-semibold text-gray-800">Câu ${qIndex + 1}: ${q.question}</p>
                        <div class="space-y-2 pl-2">${optionsHtml}</div>
                    </div>
                `;
            });
        }

        function submitQuiz() {
            let score = 0;
            let answered = 0;

            currentQuiz.forEach((q, qIndex) => {
                const selected = document.querySelector(`input[name="q_${qIndex}"]:checked`);
                if (selected) {
                    answered++;
                    if (parseInt(selected.value) === q.correct) {
                        score++;
                    }
                }
            });

            if (answered < currentQuiz.length) {
                if (!confirm(`Bạn còn ${currentQuiz.length - answered} câu chưa trả lời. Vẫn muốn nộp bài?`)) return;
            }

            // Hiển thị kết quả
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-display').innerText = `${score} / ${currentQuiz.length} điểm`;
            document.getElementById('feedback-text').innerText = `Nhân sự ${userInfo.name} đã hoàn thành bài test.`;
        }
    </script>
</body>
</html>
