<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài Test Kỹ Thuật</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 id="quiz-title" class="text-xl font-bold text-gray-800">Đang tải câu hỏi...</h2>
            <span id="user-display" class="text-sm font-semibold text-blue-600"></span>
        </div>

        <div id="quiz-form" class="space-y-6">
            <!-- Câu hỏi sẽ được render tự động vào đây -->
        </div>

        <button id="submit-btn" onclick="submitQuiz()" class="mt-8 w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition hidden">
            Nộp Bài
        </button>
    </div>

    <script type="module">
        import { db, collection, getDocs, addDoc } from './js/firebase.js';

        const username = sessionStorage.getItem('test_user');
        const category = sessionStorage.getItem('test_category');

        if (!username || !category) {
            window.location.href = 'index.html';
        }

        document.getElementById('user-display').innerText = `Nhân sự: ${username}`;
        document.getElementById('quiz-title').innerText = `Bài Test: ${category === 'cokhi' ? 'Cơ Khí Cơ Bản' : 'Gasbox'}`;

        let currentQuestions = [];

        async function loadQuestions() {
            try {
                const querySnapshot = await getDocs(collection(db, "questions"));
                let allQuestions = [];
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.category === category) {
                        allQuestions.push(data);
                    }
                });

                // Thuật toán lấy ngẫu nhiên 10 câu từ danh sách (khoảng 300 câu)
                allQuestions.sort(() => Math.random() - 0.5);
                currentQuestions = allQuestions.slice(0, 10);

                renderQuiz();
            } catch (error) {
                console.error("Lỗi tải câu hỏi:", error);
                alert("Không thể tải cơ sở dữ liệu câu hỏi. Kiểm tra lại kết nối Firebase.");
            }
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-form');
            container.innerHTML = '';

            if (currentQuestions.length === 0) {
                container.innerHTML = '<p class="text-red-500 text-center">Chưa có câu hỏi nào trong cơ sở dữ liệu phần này.</p>';
                return;
            }

            currentQuestions.forEach((q, index) => {
                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label class="block p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition">
                            <input type="radio" name="question_${index}" value="${optIndex}" class="mr-2">
                            ${opt}
                        </label>
                    `;
                });

                container.innerHTML += `
                    <div class="space-y-2">
                        <p class="font-semibold text-gray-800">Câu ${index + 1}: ${q.question}</p>
                        <div class="space-y-2 pl-4">${optionsHtml}</div>
                    </div>
                `;
            });

            document.getElementById('submit-btn').classList.remove('hidden');
        }

        window.submitQuiz = async function() {
            let score = 0;
            let answeredCount = 0;

            currentQuestions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="question_${index}"]:checked`);
                if (selected) {
                    answeredCount++;
                    if (parseInt(selected.value) === q.correct) {
                        score++;
                    }
                }
            });

            if (answeredCount < currentQuestions.length) {
                if (!confirm(`Bạn còn ${currentQuestions.length - answeredCount} câu chưa trả lời. Vẫn muốn nộp bài?`)) {
                    return;
                }
            }

            // Lưu kết quả lên Firebase
            try {
                await addDoc(collection(db, "results"), {
                    username: username,
                    category: category,
                    score: score,
                    total: currentQuestions.length,
                    timestamp: new Date().toISOString()
                });

                alert(`Đã nộp bài thành công!\nĐiểm số của bạn: ${score} / ${currentQuestions.length}`);
                window.location.href = 'index.html';
            } catch (e) {
                console.error("Lỗi lưu kết quả: ", e);
                alert("Có lỗi xảy ra khi lưu kết quả lên hệ thống.");
            }
        }

        loadQuestions();
    </script>
</body>
</html>
